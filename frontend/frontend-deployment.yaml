---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-app-frontend
  namespace: che-kube-admin-devspaces-ownaw0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: food-app-frontend
  template:
    metadata:
      labels:
        app: food-app-frontend
    spec:
      containers:
      - name: frontend
        image: quay.io/rhn_support_dmule/devspaces-demo-frontend-image:v2
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: food-app-frontend-svc
  namespace: che-kube-admin-devspaces-ownaw0
spec:
  selector:
    app: food-app-frontend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: food-app-frontend-route
  namespace: che-kube-admin-devspaces-ownaw0
spec:
  to:
    kind: Service
    name: food-app-frontend-svc
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
